<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 870" width="980" height="870" role="img">
<title>Arquitetura parcial do back-end para registrar e devolver empréstimos: rotas usam o GestorEmprestimos, que cria e usa Emprestimo e depende das interfaces RepositorioEmprestimos, RepositorioLivros e RepositorioLeitores; RepositorioEmprestimosEmBDR implementa RepositorioEmprestimos</title>
<style>
    .fundo { fill: #ffffff; }
