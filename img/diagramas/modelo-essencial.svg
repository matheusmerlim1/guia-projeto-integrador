<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510" role="img">
<title>Diagrama de classes do modelo essencial da Biblioteca Comunitária</title>
<style>
    .fundo { fill: #ffffff; }
    .caixa { fill: #ffffff; stroke: #1d232a; stroke-width: 1.4; }
    .cabecalho { fill: #dcefed; stroke: #1d232a; stroke-width: 1.4; }
    .divisoria { stroke: #1d232a; stroke-width: 1.2; }
    .nome { font: 700 15px Consolas, "Courier New", monospace; fill: #1d232a; }
    .membro { font: 13px Consolas, "Courier New", monospace; fill: #1d232a; }
    .linha { fill: none; stroke: #1d232a; stroke-width: 1.4; }
    .rotulo { font: italic 13px "Segoe UI", Arial, sans-serif; fill: #0a5252; }
    .multiplicidade { font: 13px Consolas, "Courier New", monospace; fill: #1d232a; }
</style>
<rect class="fundo" width="100%" height="100%"/>
<polyline class="linha" points="278,140.5 107.5,140.5 107.5,345"/>
<polyline class="linha" points="100.9,334 107.5,345 114.1,334"/>
<text class="multiplicidade" x="270" y="132.5" text-anchor="end">*</text>
<text class="multiplicidade" x="97.5" y="337" text-anchor="end">1</text>
<text class="rotulo" x="117.5" y="268.75" text-anchor="start">refere-se a ▼</text>
<polyline class="linha" points="583,140.5 638,140.5 638,345"/>
<polyline class="linha" points="631.4,334 638,345 644.6,334"/>
<text class="multiplicidade" x="591" y="132.5" text-anchor="start">*</text>
<text class="multiplicidade" x="628" y="337" text-anchor="end">1</text>
<text class="rotulo" x="648" y="268.75" text-anchor="start">é feito por ▼</text>
<rect class="caixa" x="278" y="30" width="305" height="221"/>
<rect class="cabecalho" x="278" y="30" width="305" height="38"/>
<line class="divisoria" x1="278" y1="128" x2="583" y2="128"/>
<text class="nome" x="430.5" y="54" text-anchor="middle">Emprestimo</text>
<text class="membro" x="292" y="92">- dataEmprestimo: Date</text>
<text class="membro" x="292" y="113">- dataDevolucao: Date [0..1]</text>
<text class="membro" x="292" y="152">+ dataLimite(): Date</text>
<text class="membro" x="292" y="173">+ estaEmAberto(): boolean</text>
<text class="membro" x="292" y="194">+ devolver(data: Date): void</text>
<text class="membro" x="292" y="215">+ diasDeAtraso(data: Date): int</text>
<text class="membro" x="292" y="236">+ calcularMulta(data: Date): double</text>
<rect class="caixa" x="30" y="345" width="155" height="135"/>
<rect class="cabecalho" x="30" y="345" width="155" height="38"/>
<line class="divisoria" x1="30" y1="464" x2="185" y2="464"/>
<text class="nome" x="107.5" y="369" text-anchor="middle">Livro</text>
<text class="membro" x="44" y="407">- titulo: String</text>
<text class="membro" x="44" y="428">- autor: String</text>
<text class="membro" x="44" y="449">- ano: int</text>
<rect class="caixa" x="446" y="345" width="384" height="137"/>
<rect class="cabecalho" x="446" y="345" width="384" height="38"/>
<line class="divisoria" x1="446" y1="443" x2="830" y2="443"/>
<text class="nome" x="638" y="369" text-anchor="middle">Leitor</text>
<text class="membro" x="460" y="407">- nome: String</text>
<text class="membro" x="460" y="428">- telefone: String</text>
<text class="membro" x="460" y="467">+ podePegarEmprestado(emAberto: int): boolean</text>
